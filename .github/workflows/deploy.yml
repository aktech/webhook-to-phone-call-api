name: Deploy to Fly.io

on:
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify app name is set
        run: |
          if [ -z "$FLY_APP_NAME" ]; then
            echo "::error::FLY_APP_NAME repository variable is not set"
            exit 1
          fi

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if it doesn't exist
        run: |
          if ! flyctl status --app "$FLY_APP_NAME" 2>/dev/null; then
            echo "Creating app..."
            flyctl apps create "$FLY_APP_NAME"
          else
            echo "App already exists"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set Fly.io secrets
        run: |
          flyctl secrets set \
            --app "$FLY_APP_NAME" \
            TOKEN="${{ secrets.TOKEN }}" \
            TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}" \
            TWILIO_API_KEY_SID="${{ secrets.TWILIO_API_KEY_SID }}" \
            TWILIO_API_KEY_SECRET="${{ secrets.TWILIO_API_KEY_SECRET }}" \
            TWILIO_FROM_NUMBER="${{ secrets.TWILIO_FROM_NUMBER }}" \
            ALERT_TO_NUMBER="${{ secrets.ALERT_TO_NUMBER }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app "$FLY_APP_NAME"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
