name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.2'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if it doesn't exist
        run: |
          if ! flyctl status --app alerts-api 2>/dev/null; then
            echo "Creating app..."
            flyctl apps create alerts-api
          else
            echo "App already exists"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set Fly.io secrets
        run: |
          flyctl secrets set \
            TOKEN="${{ secrets.TOKEN }}" \
            TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}" \
            TWILIO_API_KEY_SID="${{ secrets.TWILIO_API_KEY_SID }}" \
            TWILIO_API_KEY_SECRET="${{ secrets.TWILIO_API_KEY_SECRET }}" \
            TWILIO_FROM_NUMBER="${{ secrets.TWILIO_FROM_NUMBER }}" \
            ALERT_TO_NUMBER="${{ secrets.ALERT_TO_NUMBER }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
